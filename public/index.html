<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench</title>
<meta name="description" content="A private utility hub: developer tools, sticky notes and an OCR document organizer.">
<meta name="theme-color" content="#07080c">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/glass.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/views.css">
<link rel="stylesheet" href="/css/tools.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
    <span class="grain"></span>
  </div>

  <div class="shell" id="shell">
    <aside class="sidebar glass" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <strong>Workbench</strong>
          <small>private toolkit</small>
        </span>
      </div>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <main class="main">
      <header class="topbar glass" id="topbar"></header>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>

  <div class="tabbar glass" id="tabbar" aria-label="Sections"></div>
  <div id="overlays"></div>
  <noscript>
    <p style="padding:2rem;color:#fff">Workbench needs JavaScript enabled.</p>
  </noscript>
</body>
</html>
